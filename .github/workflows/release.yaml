name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Trusted publishing needs npm CLI 11.5.1+; staged publishing needs 11.15.0+.
        # Node 24 currently bundles npm 11.19.0.
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds

      - name: Install dependencies
        run: npm ci

      # `npm stage publish` is not documented to run lifecycle scripts, so build explicitly.
      - name: Build package
        run: npm run build

      - name: Stage package
        # `npm stage` is not workspace aware, so run it from the package directory.
        # npm uses trusted publishing (OIDC) when it is configured on npmjs.com
        # and falls back to the NODE_AUTH_TOKEN granular access token otherwise.
        # A maintainer then approves the staged version with 2FA:
        #   npm stage list @kodeblox/nestjs-nats-jetstream-transport
        #   npm stage approve <stage-id>
        working-directory: packages/nestjs-nats-jetstream-transport
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
