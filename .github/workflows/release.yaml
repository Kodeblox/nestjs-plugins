name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # npm CLI 11.5.1+ ships with Node 24 and is required for trusted publishing.
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        # `prepack` in the package builds `dist` before the tarball is created.
        # npm uses trusted publishing (OIDC) when it is configured on npmjs.com
        # and falls back to the NODE_AUTH_TOKEN granular access token otherwise.
        run: npm publish --workspace=@kodeblox/nestjs-nats-jetstream-transport
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
