name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        # `prepack` in the package builds `dist` before the tarball is created.
        run: npm publish --workspace=@kodeblox/nestjs-nats-jetstream-transport
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
